name: ci

# Invocation-only. No schedule, no push, no pull_request.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was triggered
        required: false
        default: manual
        type: string

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Replace/extend this step with `go test ./...` once the Go code lands.
      - name: Check docs links
        id: docs
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci
          python scripts/check_docs.py 2>&1 | tee ci/docs-check.log

      - name: Write machine-readable result
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          python scripts/ci_summary.py \
            --docs-outcome "${{ steps.docs.outcome }}" \
            --reason "$REASON" \
            --details-file ci/docs-check.log

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-run.json
          git commit -m "ci: record run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:main

      - name: Fail if the docs check failed
        if: always() && steps.docs.outcome != 'success'
        run: exit 1
