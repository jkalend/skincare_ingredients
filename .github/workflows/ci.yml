name: ci

# Invocation-only. No schedule, no push, no pull_request.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this run was triggered
        required: false
        default: manual
        type: string

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go tests
        id: gotest
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ci
          go test ./... 2>&1 | tee ci/go-test.log

      - name: Build static binary
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/skincare ./cmd/skincare 2>&1 | tee ci/build.log
          ls -l dist/skincare

      - name: CLI smoke
        id: smoke
        continue-on-error: true
        run: |
          set -o pipefail
          ./dist/skincare doctor > ci/doctor.json
          ./dist/skincare analyze --text "Aqua, Glycerin, Niacinamide, Cyclomethicone" > ci/analyze.json
          grep -q '"canonical": "AQUA"' ci/analyze.json
          grep -q '"reference": "1388"' ci/analyze.json
          echo "doctor and analyze smoke passed" | tee ci/smoke.log

      - name: Check docs links
        id: docs
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/check_docs.py 2>&1 | tee ci/docs-check.log

      - name: Write machine-readable result
        if: always()
        env:
          REASON: ${{ inputs.reason }}
        run: |
          python scripts/ci_summary.py \
            --docs-outcome "${{ steps.docs.outcome }}" \
            --go-outcome "${{ steps.gotest.outcome }}" \
            --build-outcome "${{ steps.build.outcome }}" \
            --smoke-outcome "${{ steps.smoke.outcome }}" \
            --reason "$REASON" \
            --details-file ci/docs-check.log \
            --go-details-file ci/go-test.log \
            --build-details-file ci/build.log \
            --smoke-details-file ci/smoke.log \
            --binary dist/skincare

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-run.json
          git commit -m "ci: record run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:main

      - name: Fail if any check failed
        if: always() && (steps.docs.outcome != 'success' || steps.gotest.outcome != 'success' || steps.build.outcome != 'success' || steps.smoke.outcome != 'success')
        run: exit 1
